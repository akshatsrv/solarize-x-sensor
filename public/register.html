<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activate your console account</title>
  <link rel="stylesheet" href="/register.css">
  <script type="module" src="/register.js"></script>
</head>
<body>
  <main>
    <h1>Activate your account</h1>
    <p>Use the user name and invitation code from your superuser.</p>
    <form id="register">
      <label>User name<input id="register-user" maxlength="64" autocomplete="username" required></label>
      <label>Invitation code<input id="register-invite" maxlength="128" autocomplete="off" required></label>
      <label>New password<input id="register-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <label>Confirm password<input id="register-confirm" type="password" autocomplete="new-password" required></label>
      <button id="register-submit" type="submit">Activate account</button>
    </form>
    <p id="register-message" role="status"></p>
    <a href="/">Sign in to the console</a>
  </main>
</body>
</html>
